[tools]
# CI: Node 24 (iOS) / 20 (Android) and Temurin 17 for the Gradle build.
node = "24.21.0"
java = "temurin-17.0.20+101"
# Used by the .githooks/pre-commit secret scan.
gitleaks = "8.30.1"
# Maestro drives the Android/iOS builds for the parity flows (PARITY_PLAN L3).
maestro = "cli-2.11.0"

[tasks.android]
description = "Build the Kotlin Android app (kmp/) and run it on the connected device or emulator"
run = '''
#!/usr/bin/env bash
set -euo pipefail
# The Android SDK: $ANDROID_HOME if set, else the default Android Studio location.
export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
if [ ! -d "$ANDROID_HOME/platform-tools" ]; then
  echo "No Android SDK at $ANDROID_HOME. Install one (Android Studio) or set ANDROID_HOME." >&2
  exit 1
fi
adb="$ANDROID_HOME/platform-tools/adb"
if ! "$adb" devices | grep -qE $'\tdevice$'; then
  echo "No device connected. Plug in a phone with USB debugging, or start an emulator." >&2
  exit 1
fi
# The app bundles the RN app's icon font from node_modules.
[ -d node_modules/@expo/vector-icons ] || npm ci
cd kmp
if ! out=$(./gradlew :androidApp:installDebug --console=plain 2>&1); then
  echo "$out" | tail -25
  if echo "$out" | grep -q INSTALL_FAILED_UPDATE_INCOMPATIBLE; then
    echo >&2
    echo "The RN app is installed with a different signing key. Uninstall it first (this deletes its data):" >&2
    echo "  $adb uninstall com.backtosafety.app" >&2
  fi
  exit 1
fi
"$adb" shell am start -n com.backtosafety.app/.MainActivity >/dev/null
echo "Installed and launched Back to Safety (Kotlin)."
'''
