[versions]
kotlin = "2.4.20"
agp = "9.4.1"
serialization = "1.11.0"
datetime = "0.8.0"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
navigation-compose = "2.10.2"
roborazzi = "1.76.0"
jna = "5.17.0"

[libraries]
# The splash screen the RN app shows (expo-splash-screen uses it).
core-splashscreen = { module = "androidx.core:core-splashscreen", version = "1.2.0" }
# Same analytics backend as the RN app (posthog-react-native).
posthog-android = { module = "com.posthog:posthog-android", version = "3.72.1" }
# The cropper expo-image-picker uses (allowsEditing), so the crop screen is the same.
android-image-cropper = { module = "com.vanniktech:android-image-cropper", version = "4.7.0" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation-compose" }

# UniFFI's Kotlin bindings reach the Rust core through JNA: the AAR carries its Android library,
# the plain jar the desktop ones (the JVM snapshot tests).
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }

# Snapshot tests (androidApp/src/test): Compose screens rendered on the JVM by Robolectric,
# compared with reference images by Roborazzi.
robolectric = { module = "org.robolectric:robolectric", version = "4.17" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit = { module = "io.github.takahirom.roborazzi:roborazzi-junit-rule", version.ref = "roborazzi" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
junit = { module = "junit:junit", version = "4.13.2" }

[plugins]
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
