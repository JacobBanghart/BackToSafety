# The SwiftUI app (PARITY_PLAN: KMP core + native UIs). `xcodegen generate` writes the Xcode
# project from this file; maestro/build-ios.sh builds it for the simulator.
name: BackToSafety
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    # The App Store team, so a Debug run on a plugged-in iPhone signs automatically.
    DEVELOPMENT_TEAM: 5YA2HVNWZ5
packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.0.0
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.17.0
targets:
  BackToSafety:
    type: application
    platform: iOS
    scheme:
      testTargets: [BackToSafetyTests]
    sources:
      - BackToSafety
      # Strings and logo shared with the Android app, so both show the same text and art.
      - path: ../../i18n/locales
        type: folder
        buildPhase: resources
      - path: ../../assets/images/logo-full.png
        buildPhase: resources
    # The shared Kotlin core, built by Gradle for whatever Xcode is building (configuration,
    # simulator or device), so a Run always picks up Kotlin changes. Gradle needs Java and an
    # Android SDK location (the core has an Android target); Xcode started from the Dock has
    # neither, so they come from the repo's mise tools.
    preBuildScripts:
      - name: Build the shared Kotlin core
        basedOnDependencyAnalysis: false
        script: |
          set -e
          export PATH="/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          if command -v mise >/dev/null; then
            eval "$(cd "$SRCROOT/../.." && mise env -s bash)"
          fi
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode --console=plain
    # Version and build number come from version.json: the release workflow
    # stamps the tag's version and the run number there before building. Runs before signing.
    postBuildScripts:
      - name: Version from version.json
        basedOnDependencyAnalysis: false
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          version=$(/usr/bin/plutil -extract version raw "$SRCROOT/../../version.json")
          build=$(/usr/bin/plutil -extract ios.buildNumber raw "$SRCROOT/../../version.json")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" -c "Set :CFBundleVersion $build" "$plist"
    dependencies:
      - package: PostHog
    info:
      path: BackToSafety/Info.plist
      properties:
        CFBundleDisplayName: Back to Safety
        # Set from version.json by the build phase below.
        CFBundleShortVersionString: '0'
        CFBundleVersion: '0'
        UILaunchStoryboardName: SplashScreen
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Set from the environment at build time.
        PostHogKey: $(POSTHOG_KEY)
        PostHogHost: $(POSTHOG_HOST)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [backtosafety]
        NSCameraUsageDescription: Allow Back to Safety to use your camera to take a profile photo for emergency identification.
        NSContactsUsageDescription: Allow Back to Safety to access your contacts so you can quickly import emergency contacts.
        NSPhotoLibraryUsageDescription: Allow Back to Safety to access your photos so you can choose or update a profile picture for emergency identification.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backtosafety.app
        PRODUCT_NAME: BackToSafety
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The framework the build phase above puts here (static: linked, not embedded).
        FRAMEWORK_SEARCH_PATHS: ['$(inherited)', '$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)']
        OTHER_LDFLAGS: [-lsqlite3, -framework, Shared]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Release signing for the App Store, from ios-release.yml (RELEASE_TEAM_ID,
        # RELEASE_PROFILE_UUID). Set here rather than on the xcodebuild command line, where they'd
        # also reach the PostHog package, which can't take a provisioning profile. Empty locally.
        Release:
          DEVELOPMENT_TEAM: $(RELEASE_TEAM_ID)
          PROVISIONING_PROFILE_SPECIFIER: $(RELEASE_PROFILE_UUID)
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: iPhone Distribution
  # Snapshot tests of every main screen (BackToSafetyTests/__Snapshots__), hosted by the app.
  BackToSafetyTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BackToSafetyTests]
    dependencies:
      - target: BackToSafety
      - package: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backtosafety.app.tests
        GENERATE_INFOPLIST_FILE: YES
