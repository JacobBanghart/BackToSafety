# The SwiftUI app (PARITY_PLAN: KMP core + native UIs). `xcodegen generate` writes the Xcode
# project from this file; maestro/build-ios-kotlin.sh builds it for the simulator.
name: BackToSafety
options:
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    DEVELOPMENT_TEAM: ''
packages:
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.0.0
targets:
  BackToSafety:
    type: application
    platform: iOS
    sources:
      - BackToSafety
      # The RN app's strings and logo, so both apps show the same text and art.
      - path: ../../i18n/locales
        type: folder
        buildPhase: resources
      - path: ../../assets/images/logo-full.png
        buildPhase: resources
      # The RN app's icon and launch screen (expo prebuild output, committed under ios/).
      - path: ../../ios/BacktoSafety/Images.xcassets
      - path: ../../ios/BacktoSafety/SplashScreen.storyboard
    # Version and build number come from app.json, as the RN app's do: the release workflow
    # stamps the tag's version and the run number there before building. Runs before signing.
    postBuildScripts:
      - name: Version from app.json
        basedOnDependencyAnalysis: false
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          version=$(/usr/bin/plutil -extract expo.version raw "$SRCROOT/../../app.json")
          build=$(/usr/bin/plutil -extract expo.ios.buildNumber raw "$SRCROOT/../../app.json")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" -c "Set :CFBundleVersion $build" "$plist"
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/Shared.xcframework
        embed: false
      - package: PostHog
    info:
      path: BackToSafety/Info.plist
      properties:
        CFBundleDisplayName: Back to Safety
        # Set from app.json by the build phase below.
        CFBundleShortVersionString: '0'
        CFBundleVersion: '0'
        UILaunchStoryboardName: SplashScreen
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Set from the environment at build time, as the RN app's EXPO_PUBLIC_ vars are.
        PostHogKey: $(EXPO_PUBLIC_POSTHOG_KEY)
        PostHogHost: $(EXPO_PUBLIC_POSTHOG_HOST)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [backtosafety]
        NSCameraUsageDescription: Allow Back to Safety to use your camera to take a profile photo for emergency identification.
        NSContactsUsageDescription: Allow Back to Safety to access your contacts so you can quickly import emergency contacts.
        NSPhotoLibraryUsageDescription: Allow Back to Safety to access your photos so you can choose or update a profile picture for emergency identification.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backtosafety.app
        PRODUCT_NAME: BackToSafety
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: [-lsqlite3]
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        # Release signing for the App Store, from ios-release.yml (RELEASE_TEAM_ID,
        # RELEASE_PROFILE_UUID). Set here rather than on the xcodebuild command line, where they'd
        # also reach the PostHog package, which can't take a provisioning profile. Empty locally.
        Release:
          DEVELOPMENT_TEAM: $(RELEASE_TEAM_ID)
          PROVISIONING_PROFILE_SPECIFIER: $(RELEASE_PROFILE_UUID)
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: iPhone Distribution
