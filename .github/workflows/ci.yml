name: CI

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# mise installs tools from GitHub releases; unauthenticated, the shared runner IPs hit the
# 60-requests-an-hour API limit.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  contracts:
    name: Spec contracts (testIDs, features)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Both apps carry every testID in spec/testids.json, and every feature's coverage
      # references resolve (spec/check.py).
      - name: Check
        run: python3 spec/check.py

  lint:
    name: Lint (ktlint, SwiftFormat, actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup linters (mise.toml)
        uses: jdx/mise-action@v5
        with:
          install_args: java ktlint swiftformat actionlint

      - name: Lint
        run: mise run lint

  rust-core:
    name: Rust core (spec vectors, store, migrations)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust (mise.toml)
        uses: jdx/mise-action@v5
        with:
          install_args: rust

      # The core is held to spec/vectors, the committed upgrade fixture and the Room v2 schema.
      - name: Tests
        working-directory: rust
        run: cargo test -p nijii-core

  kotlin-android:
    name: Kotlin Android app (build)
    runs-on: ubuntu-latest
    env:
      # The Gradle build runs cargo through rust/scripts/heavy.sh's queue, meant for the shared
      # devbox; this runner is its own.
      NIJII_HEAVY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Java for Gradle; Rust with the Android targets (mise.toml) and cargo-ndk for the core,
      # which Gradle builds for the device ABIs and for the JVM snapshot tests.
      - name: Setup Java, Rust and cargo-ndk (mise.toml)
        uses: jdx/mise-action@v5
        with:
          install_args: java rust cargo-binstall cargo:cargo-ndk

      - name: Install the Android NDK
        run: |
          set -euo pipefail
          ndk="ndk;29.0.14206865"
          # The runner's preinstalled SDK; its sdkmanager isn't on PATH.
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "$ndk"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Build
        working-directory: kmp
        run: ./gradlew :androidApp:assembleRelease --console=plain

      # Android lint, errors only: calls to APIs newer than minSdk (API 24) crash older phones.
      - name: Lint
        working-directory: kmp
        run: ./gradlew :androidApp:lintRelease --console=plain

      # Every main screen rendered on the JVM, compared with src/test/snapshots.
      - name: Snapshot tests
        working-directory: kmp
        run: ./gradlew :androidApp:testDebugUnitTest --console=plain

      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-snapshot-diffs
          path: kmp/androidApp/build/outputs/roborazzi/

  kotlin-ios:
    name: SwiftUI iOS app (build)
    # GitHub-hosted: macOS minutes are free for public repositories.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust (mise.toml)
        uses: jdx/mise-action@v5
        with:
          install_args: rust

      - name: Install XcodeGen
        run: brew install xcodegen

      # The SwiftUI app for the simulator, on the Rust core (build-ios.sh runs mise run ios:rust).
      - name: Build
        run: maestro/build-ios.sh

      # The app bundle carries its resources: icon, launch screen, privacy manifest, strings,
      # and the version from version.json.
      - name: Check the bundle
        run: |
          set -euo pipefail
          APP=kmp/iosApp/build/Build/Products/Release-iphonesimulator/BackToSafety.app
          for f in Assets.car SplashScreen.storyboardc PrivacyInfo.xcprivacy locales/en/common.json logo-full.png; do
            test -e "$APP/$f" || { echo "missing $f"; exit 1; }
          done
          check() { [ "$2" = "$3" ] || { echo "$1: $2, expected $3"; exit 1; }; }
          plist() { plutil -extract "$1" raw "$APP/Info.plist" 2>&1; }
          json() { python3 -c "import json,sys; d=json.load(open('version.json')); print(eval(sys.argv[1]))" "$1"; }
          check version "$(plist CFBundleShortVersionString)" "$(json 'd["version"]')"
          check build "$(plist CFBundleVersion)" "$(json 'd["ios"]["buildNumber"]')"
          # Older Xcodes write the icon name only under CFBundleIcons.
          if plutil -extract CFBundleIconName raw "$APP/Info.plist" >/dev/null 2>&1; then
            icon=$(plist CFBundleIconName)
          else
            icon=$(plist CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName)
          fi
          check icon "$icon" AppIcon

      # Every main screen on a fixed simulator, compared with BackToSafetyTests/__Snapshots__.
      # A missing reference is recorded and fails the run: the upload has it to commit.
      - name: Snapshot tests
        working-directory: kmp/iosApp
        run: |
          set -euo pipefail
          xcodebuild -version
          sim=$(xcrun simctl list devices available | grep -m1 -E '^ +iPhone 16 Pro \(' | grep -oE '[0-9A-F-]{36}')
          TEST_RUNNER_SNAPSHOT_ARTIFACTS="$RUNNER_TEMP/snapshot-diffs" xcodebuild test \
            -project BackToSafety.xcodeproj -scheme BackToSafety -destination "id=$sim" \
            -derivedDataPath build-tests CODE_SIGNING_ALLOWED=NO -quiet

      - name: Upload snapshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-snapshots
          path: |
            kmp/iosApp/BackToSafetyTests/__Snapshots__/
            ${{ runner.temp }}/snapshot-diffs/
