name: CI

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests, bundles
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node (mise.toml)
        uses: jdx/mise-action@v5
        with:
          install_args: node

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, spec and vector tests
        run: npm test

      - name: Expo dependency check
        run: npx expo install --check

      # Bundling catches what typecheck can't: SDK 57 shipped with every platform
      # failing to bundle and nothing noticed until a release was attempted.
      - name: Bundle every platform
        run: |
          for platform in web android ios; do
            npx expo export --platform "$platform" --output-dir "dist-$platform"
          done

  kotlin-core:
    name: Kotlin core (spec vectors)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java (mise.toml)
        uses: jdx/mise-action@v5
        with:
          install_args: java

      # The shared KMP core is held to the same spec/vectors as the RN app.
      - name: JVM tests
        working-directory: kmp
        run: ./gradlew :shared:jvmTest --console=plain

  kotlin-android:
    name: Kotlin Android app (build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java and Node (mise.toml)
        uses: jdx/mise-action@v5
        with:
          install_args: java node

      # The app bundles the RN app's icon font and glyph map from node_modules.
      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: kmp
        run: ./gradlew :androidApp:assembleRelease --console=plain

  e2e-web:
    name: Playwright (web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node (mise.toml)
        uses: jdx/mise-action@v5
        with:
          install_args: node

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
