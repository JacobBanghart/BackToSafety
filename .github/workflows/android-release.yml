name: Android Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-android-aab:
    runs-on: [self-hosted, linux]
    env:
      GRADLE_USER_HOME: /opt/hostedtoolcache/gradle
      ANDROID_SDK_ROOT: /opt/hostedtoolcache/android-sdk
      ANDROID_HOME: /opt/hostedtoolcache/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure Android SDK and local.properties
        run: |
          set -euo pipefail

          SDKMANAGER_BIN="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER_BIN" ]; then
            echo "sdkmanager was not found on PATH after setup-android"
            exit 1
          fi

          SDK_PATH="${ANDROID_SDK_ROOT}"
          mkdir -p "$SDK_PATH"

          set +o pipefail
          yes | "$SDKMANAGER_BIN" --sdk_root="$SDK_PATH" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER_BIN" --sdk_root="$SDK_PATH" \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;36.0.0"

          echo "Using Android SDK at $SDK_PATH"
          printf 'sdk.dir=%s\n' "$SDK_PATH" > kmp/local.properties

      - name: Install dependencies
        run: npm ci

      - name: Decode Android release keystore
        run: |
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Derive release version metadata from tag
        id: release_meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="internal-build-${GITHUB_RUN_NUMBER}"
          fi

          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          if echo "$VERSION" | grep -Eq '^internal-v[0-9]+\.[0-9]+\.[0-9]+-build[0-9]+$'; then
            VERSION_CODE="${VERSION##*build}"
          fi

          VERSION_NAME="$VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Stamp version into app.json
        run: |
          VERSION="${{ steps.release_meta.outputs.version_name }}"
          # Strip leading 'v' so the app displays e.g. "1.3.3" not "v1.3.3"
          VERSION="${VERSION#v}"
          VERSION_CODE="${{ steps.release_meta.outputs.version_code }}"
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            cfg.expo.version = '$VERSION';
            cfg.expo.android.versionCode = parseInt('$VERSION_CODE', 10);
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2) + '\n');
          "
          echo "Stamped app.json: version=$VERSION versionCode=$VERSION_CODE"

      # The native app (kmp/androidApp). Version name and code come from the app.json stamped
      # above; it signs with the same upload key the RN release used.
      - name: Build signed Android App Bundle
        run: ./gradlew :androidApp:bundleRelease --console=plain --build-cache -Dorg.gradle.parallel=true
        working-directory: kmp
        env:
          EXPO_PUBLIC_POSTHOG_KEY: phc_yiHs692GvzSjuCHNUTpSGx99UrD5cnCmJD7mjD7WBoJN
          EXPO_PUBLIC_POSTHOG_HOST: https://t.backtosafety.app
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Version AAB filename
        id: aab_meta
        run: |
          VERSION="${{ steps.release_meta.outputs.version }}"

          AAB_NAME="BackToSafety-${VERSION}.aab"
          cp kmp/androidApp/build/outputs/bundle/release/androidApp-release.aab "kmp/androidApp/build/outputs/bundle/release/${AAB_NAME}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "aab_name=${AAB_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-aab-${{ steps.aab_meta.outputs.version }}
          path: kmp/androidApp/build/outputs/bundle/release/${{ steps.aab_meta.outputs.aab_name }}
          if-no-files-found: error

      - name: Attach AAB to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: kmp/androidApp/build/outputs/bundle/release/${{ steps.aab_meta.outputs.aab_name }}
