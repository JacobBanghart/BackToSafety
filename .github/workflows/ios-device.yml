name: iOS Device Install

# Builds the SwiftUI app (Debug, development-signed) and installs and launches it on an
# iPhone plugged into the Mac runner. Signing goes through the App Store Connect API key,
# which lets Xcode create the development certificate and profile and register the device
# without anyone at the Mac.

on:
  workflow_dispatch:
    inputs:
      device:
        description: Device UDID (xcrun devicectl list devices / Xcode Devices window)
        required: true
        default: '00008150-000C25360C20401C'

permissions:
  contents: read

jobs:
  install:
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build shared Kotlin framework
        working-directory: kmp
        run: ./gradlew :shared:assembleSharedReleaseXCFramework --console=plain

      - name: Generate Xcode project
        working-directory: kmp/iosApp
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Install App Store Connect API key
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}

      - name: Build for the device
        run: |
          set -euo pipefail
          xcodebuild build \
            -project kmp/iosApp/BackToSafety.xcodeproj \
            -scheme BackToSafety \
            -configuration Debug \
            -destination "platform=iOS,id=${{ inputs.device }}" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_KEY_ISSUER_ID" \
            CODE_SIGN_STYLE=Automatic
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_ISSUER_ID: ${{ secrets.ASC_API_KEY_ISSUER_ID }}

      - name: Install and launch
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphoneos/BackToSafety.app"
          xcrun devicectl device install app --device "${{ inputs.device }}" "$APP"
          xcrun devicectl device process launch --device "${{ inputs.device }}" com.backtosafety.app

      - name: Remove API key
        if: always()
        run: rm -f "$ASC_KEY_PATH"
