[workspace]
resolver = "3"
members = ["core", "uniffi-bindgen"]

[workspace.package]
edition = "2024"
version = "1.4.0"

# The library the apps ship: whole-program optimized and stripped (it was 5.8 MB per ABI
# without this). Panics still unwind: UniFFI turns a panic into a Kotlin/Swift exception.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "symbols"
