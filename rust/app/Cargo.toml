[package]
name = "nijii"
edition.workspace = true
version.workspace = true

[dependencies]
dioxus = { version = "0.7.10", features = ["router"] }
nijii-core = { path = "../core" }
serde_json = "1"

[build-dependencies]
base64 = "0.22"
serde_json = { version = "1", features = ["preserve_order"] }

[features]
default = []
mobile = ["dioxus/mobile"]
desktop = ["dioxus/desktop"]
