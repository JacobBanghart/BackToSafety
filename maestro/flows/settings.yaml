# Features: settings.theme, settings.about, settings.delete-account
appId: com.backtosafety.app
name: Theme persists; deleting the account returns to onboarding
---
- runFlow:
    file: ../subflows/onboard.yaml
    env:
      NAME: Margaret Smith

- tapOn:
    id: home-settings
- tapOn:
    id: settings-theme-dark
- stopApp
- launchApp
- tapOn:
    id: home-settings
- scrollUntilVisible:
    element:
      id: settings-device-id

- scrollUntilVisible:
    element:
      id: settings-delete-account
- tapOn:
    id: settings-delete-account
# The confirmation's button: the "Delete Account" under the alert's message (the section
# title and the button behind the alert say "Delete Account" too).
- tapOn:
    text: Delete Account
    below:
      text: 'This will permanently.*'
- assertVisible:
    id: onboarding-get-started
