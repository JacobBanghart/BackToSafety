# Features: profile.photo
appId: com.backtosafety.app
name: A photo chosen from the library is saved, shown, and offered to 911
---
- runFlow:
    file: ../subflows/onboard.yaml
    env:
      NAME: Margaret Smith
- addMedia:
    - media/test-photo.jpg
- tapOn:
    id: home-profile
- tapOn:
    id: profile-photo-library
# The system photo picker (the added photo is the newest), then the square crop screen.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: 'Photo taken on.*'
      - tapOn:
          id: com.backtosafety.app:id/crop_image_menu_crop
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: 'Photo, .*'
          index: 0
      - tapOn: Choose
- assertVisible:
    id: profile-photo
- tapOn:
    id: profile-save

# Kept across a cold restart, on home and in the 911 script (F-12).
- stopApp
- launchApp
- assertVisible:
    id: home-photo
- tapOn:
    id: home-readout
- tapOn:
    id: readout-script-toggle
- assertVisible:
    id: readout-script-text
    text: '.*Photo available\..*'
