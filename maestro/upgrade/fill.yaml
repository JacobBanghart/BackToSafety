# Fills every kind of persisted data through the UI (spec/storage.md), so the upgrade
# test can check that a newer build reads all of it. verify.yaml checks the same values.
appId: com.backtosafety.app
---
- runFlow:
    file: ../subflows/onboard.yaml
    env:
      NAME: Margaret Smith
      NICKNAME: Maggie
      CONTACT_NAME: John Smith
      CONTACT_PHONE: '5551234567'

# Profile: a field from each section, hand and mobility.
- tapOn:
    id: home-profile
- tapOn:
    id: profile-field-dateOfBirth
- inputText: '03151940'
- runFlow: ../subflows/hide-keyboard.yaml
- scrollUntilVisible:
    element:
      id: profile-field-height
- tapOn:
    id: profile-field-height
- inputText: '56'
- runFlow: ../subflows/hide-keyboard.yaml
- scrollUntilVisible:
    element:
      id: profile-section-medical
- tapOn:
    id: profile-section-medical
# On iOS, opening the section scrolls this field up under the header, where it still counts
# as visible and a tap lands on the header: drag it back down first.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 35%
          end: 50%, 65%
- tapOn:
    id: profile-field-medicalConditions
- inputText: Moderate Alzheimer's
- runFlow: ../subflows/hide-keyboard.yaml
- scrollUntilVisible:
    element:
      id: profile-hand-left
- tapOn:
    id: profile-hand-left
- scrollUntilVisible:
    element:
      id: profile-mobility-uses-cane
- tapOn:
    id: profile-mobility-uses-cane
- tapOn:
    id: profile-save

# A place.
- tapOn:
    id: home-places
- tapOn:
    id: destinations-empty-add
- tapOn:
    id: destinations-form-name
- inputText: Riverside Park
- runFlow: ../subflows/hide-keyboard.yaml
- tapOn:
    id: destinations-form-category-water
- tapOn:
    id: destinations-save
- tapOn:
    id: destinations-back

# Settings: dark theme.
- tapOn:
    id: home-settings
- tapOn:
    id: settings-theme-dark
- tapOn:
    id: settings-back

# An emergency in progress, with two steps checked and clothing noted.
- tapOn:
    id: home-start-emergency
- tapOn:
    id: emergency-wearing-input
- inputText: Blue jacket
- runFlow: ../subflows/hide-keyboard.yaml
# The steps can sit below the fold (an iPhone 17 Pro, under the direction hint). Scroll to
# the step after each one, so the tapped step is mid-screen rather than under the header.
- scrollUntilVisible:
    element:
      id: emergency-step-outside_immediate
- tapOn:
    id: emergency-step-home_search
- scrollUntilVisible:
    element:
      id: emergency-step-radius_search
- tapOn:
    id: emergency-step-neighbors
