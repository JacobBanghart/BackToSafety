appId: com.backtosafety.app
---
- runFlow:
    file: ../subflows/onboard.yaml
    env:
      NAME: Margaret Smith
      NICKNAME: Maggie
      CONTACT_NAME: John Smith
      CONTACT_PHONE: '5551234567'
- runFlow: ../subflows/freeze-clock.yaml
- tapOn:
    id: home-start-emergency
- openLink: backtosafety://debug/clock?advance=900
- assertVisible:
    id: emergency-timer
    text: '00:00'
