appId: com.backtosafety.app
---
- runFlow:
    file: ../subflows/onboard.yaml
    env:
      NAME: Margaret Smith
      NICKNAME: Maggie
      CONTACT_NAME: John Smith
      CONTACT_PHONE: '5551234567'
- runFlow: ../subflows/freeze-clock.yaml
- tapOn:
    id: home-start-emergency
- scrollUntilVisible:
    element:
      id: emergency-step-home_search
    centerElement: true
- tapOn:
    id: emergency-step-home_search
- scrollUntilVisible:
    element:
      id: emergency-step-outside_immediate
    centerElement: true
- tapOn:
    id: emergency-step-outside_immediate
- scrollUntilVisible:
    element:
      id: emergency-wearing-input
    direction: UP
- tapOn:
    id: emergency-wearing-input
- inputText: Blue jacket, gray pants
- hideKeyboard
# Blur the input so no blinking caret ends up in the capture. At large text the label
# can end up just above the viewport once the keyboard is gone.
- scrollUntilVisible:
    element:
      id: emergency-timer-label
    direction: UP
- tapOn:
    id: emergency-timer-label
- openLink: backtosafety://debug/clock?advance=300
# Leave and resume: the emergency screen reopens scrolled to the top, which scrolling
# back up doesn't do reliably.
- tapOn:
    id: emergency-back
- tapOn:
    id: emergency-modal-leave-leave
- tapOn:
    id: home-start-emergency
- assertVisible:
    id: emergency-timer
    text: '10:00'
