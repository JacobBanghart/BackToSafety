# The iOS gesture driver for reorder-ios.sh: an XCUITest bundle with no host app, so it
# drives whichever Back to Safety build is installed (RN or SwiftUI) without reinstalling it.
name: Gestures
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  GestureTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GestureTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.backtosafety.gestures
        GENERATE_INFOPLIST_FILE: YES
schemes:
  GestureTests:
    build:
      targets:
        GestureTests: [test]
    test:
      targets: [GestureTests]
